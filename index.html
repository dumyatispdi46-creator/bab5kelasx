<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Media PAI X — Meneladani Peran Ulama Penyebar Islam di Indonesia</title><style>
:root{--g:#1b7a4b;--gd:#0f4f30;--gl:#e8f5ec;--y:#e0a800;--bg:#f6faf7;--t:#1d2b23;--c:#fff;--b:#cfe3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--t:#e6f1ea;--c:#16261c;--b:#2b4636;--gl:#1c3326}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:14px 16px;text-align:center}header h1{margin:0;font-size:1.05rem}header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--b);background:var(--gl);color:var(--t);border-radius:20px;padding:6px 12px;font-size:.8rem;cursor:pointer}
nav button.on{background:var(--g);color:#fff}nav button.lock{opacity:.5}
main{max-width:820px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
h2{color:var(--g);margin-top:0}h3{color:var(--g);margin:.6em 0 .2em}.ar{font-family:'Amiri','Traditional Arabic',serif;font-size:1.7rem;direction:rtl;text-align:right;line-height:2.3;background:var(--gl);border-radius:8px;padding:10px 14px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:.95rem;cursor:pointer;margin:4px 4px 4px 0}.btn.o{background:var(--y);color:#222}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;margin:4px 0 10px;background:var(--c);color:var(--t);font-size:1rem}
.opt{display:block;width:100%;text-align:left;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;margin:5px 0;cursor:pointer}.opt.ok{background:#c8ecd3;border-color:#1b7a4b;color:#0a3}.opt.no{background:#f8d5d5;border-color:#c33;color:#900}
.timer{position:sticky;top:48px;float:right;background:var(--y);color:#222;font-weight:700;border-radius:20px;padding:4px 14px;z-index:4}.timer.w{background:#d33;color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border:1px solid var(--b);padding:6px}th{background:var(--gl)}tr:nth-child(even) td{background:var(--gl)}
.msg{padding:10px;border-radius:8px;margin:8px 0;background:var(--gl)}.bad{background:#fde3e3;color:#900}
#login{max-width:420px;margin:30px auto}.tab{overflow-x:auto}
.sec{border:1px solid var(--b);border-radius:10px;margin:10px 0;padding:0 14px 6px;background:var(--bg)}.sec summary{cursor:pointer;font-weight:700;color:var(--g);padding:10px 0;font-size:1.02rem}.sec p,.sec li{text-align:justify;margin:.5em 0}.sec ul,.sec ol{padding-left:1.3em}.sec li{margin:.45em 0}
.proj{border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg)}
</style></head><body>
<header><h1>🌿 Media Pembelajaran PAI Kelas X</h1><small>Bab 5 — Meneladani Peran Ulama Penyebar Ajaran Islam di Indonesia</small></header>
<nav id="nav" hidden></nav><main id="app"></main>
<script>
const KLS={"X-1":"ulama1","X-2":"ulama2","X-3":"ulama3","X-4":"ulama4","X-5":"ulama5","X-6":"ulama6"};
const KKM=75;
const S={user:null,step:0,kuis:[null,null,null,null,null],lat:null,ev:null,mat:false,pro:false};
try{const s=JSON.parse(localStorage.getItem("paiXulama")||"null");if(s&&s.user)Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("paiXulama",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const ST=["Tadarus","Materi","Ringkasan","Proyek","Kuis","Latihan","Evaluasi","Rekap Nilai"];
function unlocked(i){if(i<=1)return true;if(i==2)return S.mat;if(i==3)return S.mat;if(i==4)return S.pro;
 if(i==5)return S.kuis.every(k=>k!==null&&k>=KKM);if(i==6)return S.lat!==null;return S.ev!==null}
let timerI=null;
function nav(){const n=$("nav");n.hidden=false;n.innerHTML="";ST.forEach((s,i)=>{const b=document.createElement("button");b.textContent=(unlocked(i)?"":"🔒 ")+s;b.className=(i==S.step?"on ":"")+(unlocked(i)?"":"lock");b.onclick=()=>go(i);n.appendChild(b)})}
function go(i){if(!unlocked(i)){alert("Selesaikan tahap sebelumnya terlebih dahulu (semua level kuis harus lulus KKM "+KKM+").");return}
 clearInterval(timerI);S.step=i;save();nav();[tad,mater,ring,proy,kuis,latih,eval_,nilai][i]();scrollTo(0,0)}
function login(){$("nav").hidden=true;$("app").innerHTML=`<div id="login" class="card"><h2>🔐 Masuk</h2><label>Nama Lengkap</label><input id="nm" placeholder="Nama lengkap"><label>Kelas</label><select id="kl">${Object.keys(KLS).map(k=>`<option>${k}</option>`).join("")}</select><label>Password kelas</label><input id="pw" type="password" placeholder="Password kelas"><div id="er" class="msg bad" hidden></div><button class="btn" id="go">Masuk</button></div>`;
 $("go").onclick=()=>{const n=$("nm").value.trim(),k=$("kl").value,p=$("pw").value;const e=$("er");
  if(!n){e.hidden=false;e.textContent="Nama lengkap wajib diisi.";return}
  if(KLS[k]!==p){e.hidden=false;e.textContent="Password kelas salah.";return}
  S.user={n,k};save();go(S.step)}}
const nxt=(i,t)=>`<button class="btn" onclick="go(${i})">${t||"Lanjut ➜"}</button>`;
function tad(){$("app").innerHTML=`<div class="card"><h2>📖 Tadarus Pembuka</h2><p>Halo, <b>${S.user.n}</b> (${S.user.k}). Bacalah dengan tartil sesuai kaidah tajwid dan tanda waqaf, dimulai dengan basmalah.</p>
<h3 style="margin-top:14px">QS. Ali 'Imran [3]: 104</h3>
<div class="ar">وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ ۚ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ</div>
<p><small><b>Artinya:</b> "Dan hendaklah ada di antara kamu segolongan umat yang menyeru kepada kebajikan, menyuruh (berbuat) yang makruf, dan mencegah dari yang mungkar. Dan mereka itulah orang-orang yang beruntung."</small></p>
<h3 style="margin-top:14px">QS. An-Nahl [16]: 125</h3>
<div class="ar">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ ۖ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ ۚ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ ۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</div>
<p><small><b>Artinya:</b> "Serulah (manusia) kepada jalan Tuhanmu dengan hikmah dan pengajaran yang baik, dan berdebatlah dengan mereka dengan cara yang baik. Sesungguhnya Tuhanmu, Dialah yang lebih mengetahui siapa yang sesat dari jalan-Nya dan Dialah yang lebih mengetahui siapa yang mendapat petunjuk."</small></p>
<h3 style="margin-top:14px">QS. Al-Mujadalah [58]: 11</h3>
<div class="ar">يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قِيلَ لَكُمْ تَفَسَّحُوا فِي الْمَجَالِسِ فَافْسَحُوا يَفْسَحِ اللَّهُ لَكُمْ ۖ وَإِذَا قِيلَ انشُزُوا فَانشُزُوا يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ ۚ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ</div>
<p><small><b>Artinya:</b> "Wahai orang-orang yang beriman! Apabila dikatakan kepadamu, 'Berilah kelapangan di dalam majelis-majelis,' maka lapangkanlah, niscaya Allah akan memberi kelapangan untukmu. Dan apabila dikatakan, 'Berdirilah kamu,' maka berdirilah, niscaya Allah akan mengangkat (derajat) orang-orang yang beriman di antaramu dan orang-orang yang diberi ilmu pengetahuan beberapa derajat. Dan Allah Mahateliti apa yang kamu kerjakan."</small></p>
<br>${nxt(1)}</div>`}
function tg(o){document.querySelectorAll("details.sec").forEach(d=>d.open=!!o)}
function tidy(){const c=document.querySelector("#app .card"),k=[...c.children];c.innerHTML="";let cur=null;
 k.forEach(e=>{if(e.tagName=="H3"){cur=document.createElement("details");cur.className="sec";cur.open=true;const m=document.createElement("summary");m.textContent=e.textContent;cur.appendChild(m);c.appendChild(cur)}else if(e.tagName=="BUTTON"&&e.textContent.includes("sudah membaca")){c.appendChild(e)}else if(cur){cur.appendChild(e)}else c.appendChild(e)})}
function mater(){$("app").innerHTML=`<div class="card"><h2>📚 Materi Pembelajaran</h2><div><button class="btn o" onclick="tg(1)">Buka semua</button><button class="btn o" onclick="tg(0)">Tutup semua</button></div>
<p><b>Tujuan Pembelajaran:</b></p><ol><li>Memahami proses masuk dan berkembangnya Islam di Indonesia.</li><li>Mengenal peran dan metode dakwah para ulama penyebar Islam, khususnya Walisongo.</li><li>Menganalisis nilai-nilai keteladanan dari perjuangan dakwah para ulama Nusantara.</li><li>Memahami kearifan lokal dan akulturasi budaya dalam dakwah Islam di Indonesia.</li><li>Meneladani sikap santun, toleran, dan cinta ilmu dari para ulama.</li><li>Memahami hikmah penyebaran Islam secara damai bagi persatuan bangsa.</li></ol><p><i>Akidah Ahlussunnah wal Jama'ah Asy'ariyah; fikih mazhab Syafi'i.</i></p>
<h3>A. Proses Masuknya Islam ke Indonesia</h3><p>Islam masuk ke Nusantara secara damai melalui berbagai jalur, antara lain:</p><ul><li><b>Perdagangan:</b> pedagang muslim dari Arab, Persia, Gujarat, dan Cina singgah dan menetap di pelabuhan-pelabuhan Nusantara sambil berdakwah.</li><li><b>Perkawinan:</b> pedagang muslim menikah dengan penduduk pribumi, sehingga keturunannya menjadi generasi muslim baru.</li><li><b>Pendidikan:</b> berdirinya pesantren-pesantren sebagai pusat pengajaran agama Islam.</li><li><b>Tasawuf:</b> ajaran tasawuf yang menekankan kedekatan dengan Allah mudah diterima masyarakat yang sebelumnya terbiasa dengan tradisi mistik.</li><li><b>Kesenian dan budaya:</b> dakwah melalui wayang, gamelan, tembang, dan seni ukir yang disisipi nilai-nilai Islam.</li><li><b>Politik:</b> dukungan raja dan penguasa lokal yang memeluk Islam turut mempercepat penyebarannya.</li></ul><p>Pendekatan damai dan akulturatif inilah yang membuat Islam diterima luas di Nusantara tanpa paksaan dan peperangan besar.</p>
<h3>B. Dalil tentang Kewajiban Dakwah dan Keutamaan Ilmu</h3><div class="ar">وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ</div><p>QS. Ali 'Imran: 104 menegaskan pentingnya adanya sekelompok umat yang mengajak kepada kebaikan. Para ulama dan Walisongo adalah teladan nyata pengamalan ayat ini di bumi Nusantara.</p><div class="ar">يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ</div><p>QS. Al-Mujadalah: 11 menjelaskan bahwa Allah mengangkat derajat orang beriman yang berilmu. Hal ini mendasari kemuliaan kedudukan ulama sebagai pewaris para nabi dalam menyampaikan ilmu dan dakwah.</p>
<h3>C. Wali Songo: Sembilan Wali Penyebar Islam di Jawa</h3><p><b>Wali Songo</b> adalah sembilan ulama yang berperan besar menyebarkan Islam di tanah Jawa pada abad ke-15 hingga ke-16 Masehi, dengan metode dakwah yang santun dan mengakomodasi budaya setempat.</p>
<div class="tab"><table><tr><th>Nama</th><th>Wilayah Dakwah</th><th>Metode/Peran Utama</th></tr>
<tr><td>Sunan Gresik (Maulana Malik Ibrahim)</td><td>Gresik</td><td>Perintis dakwah Islam di Jawa; mengajarkan pertanian dan perniagaan kepada masyarakat.</td></tr>
<tr><td>Sunan Ampel (Raden Rahmat)</td><td>Surabaya</td><td>Mendirikan pesantren Ampel Denta; mencetak banyak kader dai; dikenal dengan ajaran "Moh Limo" (menolak lima perbuatan tercela).</td></tr>
<tr><td>Sunan Bonang (Raden Makdum Ibrahim)</td><td>Tuban</td><td>Berdakwah melalui seni gamelan dan tembang, di antaranya tembang Tombo Ati.</td></tr>
<tr><td>Sunan Drajat (Raden Qasim)</td><td>Lamongan</td><td>Menekankan kepedulian sosial dan kesejahteraan masyarakat miskin.</td></tr>
<tr><td>Sunan Giri (Raden Paku)</td><td>Gresik</td><td>Mendirikan pesantren Giri sebagai pusat pendidikan dan pemerintahan; menciptakan permainan anak bernuansa Islami.</td></tr>
<tr><td>Sunan Kalijaga (Raden Mas Said)</td><td>Jawa Tengah (Demak, Kadilangu)</td><td>Dakwah melalui wayang kulit, tembang macapat, dan akulturasi budaya Jawa yang mendalam.</td></tr>
<tr><td>Sunan Kudus (Ja'far Shadiq)</td><td>Kudus</td><td>Menjaga toleransi dengan masyarakat Hindu-Buddha, antara lain larangan menyembelih sapi demi menghormati tradisi setempat.</td></tr>
<tr><td>Sunan Muria (Raden Umar Said)</td><td>Gunung Muria, Kudus</td><td>Berdakwah kepada masyarakat pedesaan dan pegunungan melalui kesenian dan pendekatan langsung.</td></tr>
<tr><td>Sunan Gunung Jati (Syarif Hidayatullah)</td><td>Cirebon, Banten</td><td>Menggabungkan dakwah dengan kekuasaan politik; mendirikan Kesultanan Cirebon dan Banten.</td></tr>
</table></div>
<h3>D. Metode Dakwah Walisongo</h3><ul><li><b>Akulturasi budaya:</b> memanfaatkan wayang, gamelan, tembang macapat, dan tradisi lokal sebagai media dakwah tanpa menghilangkan nilai-nilai Islam.</li><li><b>Pendidikan:</b> mendirikan pesantren sebagai pusat pembelajaran agama dan kaderisasi dai.</li><li><b>Pendekatan sosial-ekonomi:</b> mengajarkan pertanian, perdagangan, dan pengobatan sambil menyisipkan dakwah.</li><li><b>Politik dan kekuasaan:</b> bekerja sama dengan penguasa lokal untuk memperluas dakwah secara damai.</li><li><b>Keteladanan akhlak:</b> menunjukkan kesantunan, kesederhanaan, dan kepedulian sosial yang menarik simpati masyarakat.</li></ul>
<h3>E. Ulama Nusantara Lainnya</h3><p>Selain Wali Songo, banyak ulama lain berperan menyebarkan Islam di berbagai wilayah Nusantara, misalnya <b>Hamzah Fansuri</b> dan <b>Syekh Nuruddin ar-Raniri</b> di Aceh yang mengembangkan sastra dan tasawuf Islami; <b>Syekh Yusuf al-Makassari</b> yang berdakwah di Sulawesi, Banten, hingga Afrika Selatan; serta <b>Datuk Ri Bandang</b> dan <b>Datuk Sulaiman</b> yang menyebarkan Islam di Sulawesi dan sekitarnya. Mereka semua mengamalkan metode dakwah yang santun, menghargai budaya lokal, dan mengutamakan pendidikan.</p>
<h3>F. Nilai-nilai Keteladanan Para Ulama</h3><ul><li><b>Ikhlas</b> dalam berdakwah, tanpa mengharap imbalan duniawi.</li><li><b>Santun dan toleran</b> terhadap budaya dan keyakinan masyarakat setempat.</li><li><b>Cinta ilmu</b> dan gigih mendirikan lembaga pendidikan.</li><li><b>Kreatif dan adaptif</b> menggunakan media dakwah yang sesuai zaman dan budaya.</li><li><b>Peduli sosial</b>, mengutamakan kesejahteraan umat.</li><li><b>Istiqamah</b>, konsisten berdakwah meski menghadapi tantangan.</li></ul>
<h3>G. Hikmah Penyebaran Islam secara Damai</h3><ul><li>Islam diterima luas tanpa kekerasan dan peperangan besar.</li><li>Budaya lokal tetap lestari dan berakulturasi harmonis dengan nilai Islam.</li><li>Terciptanya persatuan bangsa Indonesia yang majemuk dan toleran.</li><li>Lahirnya tradisi keilmuan Islam yang kuat melalui pesantren.</li><li>Menjadi teladan dakwah <i>rahmatan lil-'alamin</i> yang relevan hingga kini.</li></ul>
<button class="btn" onclick="S.mat=true;save();go(2)">Saya sudah membaca ➜ Ringkasan</button></div>`;tidy()}
function ring(){$("app").innerHTML=`<div class="card"><h2>📝 Ringkasan Materi</h2><ul><li>Islam masuk ke Indonesia secara damai melalui perdagangan, perkawinan, pendidikan, tasawuf, kesenian, dan politik.</li><li><b>Wali Songo</b>: sembilan ulama penyebar Islam di Jawa dengan metode akulturasi budaya, pendidikan, dan keteladanan akhlak.</li><li>Ulama Nusantara lain (Hamzah Fansuri, Syekh Yusuf al-Makassari, Datuk Ri Bandang, dll.) turut menyebarkan Islam di berbagai daerah.</li><li>Nilai keteladanan: ikhlas, santun, toleran, cinta ilmu, kreatif, dan peduli sosial.</li><li>Dakwah damai menjadikan Islam diterima luas dan memperkuat persatuan bangsa.</li></ul>
<button class="btn" onclick="S.pro=false;save();go(3)">Lanjut ke Proyek ➜</button></div>`}
const PROY=[
["Proyek 1 — Peta & Profil Singkat Wali Songo","Buat peta sederhana sebaran dakwah Wali Songo di Pulau Jawa beserta profil singkat metode dakwah masing-masing wali.",["Gambar/cetak peta Pulau Jawa dan tandai lokasi dakwah 9 wali.","Tulis profil singkat (nama asli, wilayah, metode dakwah) tiap wali.","Beri satu nilai keteladanan yang bisa dicontoh dari masing-masing wali.","Sajikan dalam bentuk poster atau infografis."]],
["Proyek 2 — Wawancara Tokoh/Pemuka Agama Setempat","Wawancarai kiai, ustaz, atau tokoh masyarakat tentang sejarah masuknya Islam dan peran ulama di daerah Anda.",["Siapkan 5–7 pertanyaan tentang sejarah dakwah Islam di daerah setempat.","Lakukan wawancara dan catat/rekam jawabannya.","Kaitkan hasil wawancara dengan metode dakwah Wali Songo yang dipelajari.","Sajikan hasil dalam laporan tertulis atau video singkat."]],
["Proyek 3 — Karya Kreatif Bernuansa Dakwah Akulturatif","Buat karya kreatif (cerita bergambar, naskah drama pendek, atau lagu/tembang) yang menggambarkan metode dakwah akulturasi budaya seperti yang dicontohkan Wali Songo.",["Pilih media kreatif (cerita bergambar, drama, atau tembang/lagu).","Sisipkan pesan dakwah yang santun dan menghargai budaya lokal.","Jelaskan metode dakwah wali yang menjadi inspirasi karya Anda.","Tampilkan atau presentasikan karya di depan kelas."]]];
function proy(){$("app").innerHTML=`<div class="card"><h2>🎯 Proyek</h2><p>Pilih <b>satu</b> dari tiga proyek berikut yang paling relevan dengan Anda:</p>`+PROY.map((p,i)=>`<div class="proj"><h3 style="margin:0 0 6px">${p[0]}</h3><p>${p[1]}</p><ol>${p[2].map(x=>`<li>${x}</li>`).join("")}</ol><button class="btn ${S.pj==i?"":"o"}" onclick="pilih(${i})">${S.pj==i?"✅ Dipilih":"Pilih proyek ini"}</button></div>`).join("")+`<div id="pn"></div></div>`;
 if(S.pj!==undefined&&S.pj!==null)$("pn").innerHTML=nxt(4,"Lanjut ke Kuis ➜")}
function pilih(i){S.pj=i;S.pro=true;save();proy()}

let Q={};
function runQuiz(qs,cfg){clearInterval(timerI);Q={qs,ans:Array(qs.length).fill(null),done:false,cfg};let sec=cfg.min*60;
 let h=`<div class="card"><span class="timer" id="tm">⏱ ${cfg.min}:00</span><h2>${cfg.title}</h2><p>${cfg.info}</p>`;
 qs.forEach((q,i)=>{h+=`<div class="msg"><b>${i+1}. ${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" id="o${i}_${j}" onclick="pick(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join("")+`<div id="ex${i}"></div></div>`});
 h+=`<button class="btn" onclick="fin()">Selesai & Kumpulkan</button></div>`;$("app").innerHTML=h;
 timerI=setInterval(()=>{sec--;const t=$("tm");if(!t){clearInterval(timerI);return}const m=Math.floor(sec/60),ss=sec%60;t.textContent="⏱ "+m+":"+String(ss).padStart(2,"0");if(sec<=60)t.className="timer w";if(sec<=0){clearInterval(timerI);fin(true)}},1000)}
function pick(i,j){if(Q.done)return;Q.ans[i]=j;Q.qs[i][1].forEach((_,k)=>$("o"+i+"_"+k).style.outline=k==j?"2px solid var(--g)":"none")}
function fin(auto){if(Q.done)return;const un=Q.ans.filter(a=>a===null).length;if(!auto&&un&&!confirm(un+" soal belum dijawab. Kumpulkan?"))return;
 Q.done=true;clearInterval(timerI);let ben=0;Q.qs.forEach((q,i)=>{q[1].forEach((_,k)=>{const b=$("o"+i+"_"+k);b.style.outline="none";if(k==q[2])b.classList.add("ok");else if(k==Q.ans[i])b.classList.add("no")});if(Q.ans[i]===q[2])ben++;if(q[3])$("ex"+i).innerHTML="<small>💡 "+q[3]+"</small>"});
 const nl=Math.round(ben/Q.qs.length*100);Q.cfg.done(nl,ben)}
function kuis(){const h=`<div class="card"><h2>🧩 Kuis 5 Level</h2><p>Setiap level 5 soal, waktu 5 menit, minimal nilai (KKM) <b>${KKM}</b>. Semua level harus lulus untuk membuka Latihan & Evaluasi.</p>`+["Level 1 — Dasar","Level 2 — Istilah","Level 3 — Pemahaman","Level 4 — Penerapan","Level 5 — Analisis"].map((n,i)=>`<button class="btn ${S.kuis[i]>=KKM?"":"o"}" onclick="lv(${i})">${n} ${S.kuis[i]!==null?"("+S.kuis[i]+(S.kuis[i]>=KKM?" ✅":" ❌")+")":""}</button>`).join("<br>")+`<br><br>${unlocked(5)?nxt(5,"Lanjut ke Latihan ➜"):"<small>Selesaikan semua level untuk melanjutkan.</small>"}</div>`;$("app").innerHTML=h}
function lv(i){if(i>0&&(S.kuis[i-1]===null||S.kuis[i-1]<KKM)){alert("Lulus level sebelumnya dahulu.");return}

function eval_(){if(S.ev!==null){$("app").innerHTML=`<div class="card"><h2>📋 Evaluasi</h2><p>Nilai evaluasi Anda: <b>${S.ev}</b>. ${S.ev>=KKM?"✅ Tuntas":"❌ Belum tuntas (KKM "+KKM+")"}</p><button class="btn o" onclick="S.ev=null;save();eval_()">Ulangi Evaluasi</button>${nxt(7,"Rekap Nilai ➜")}</div>`;return}

function nilai(){const ks=S.kuis.map(x=>x??0),rk=Math.round(ks.reduce((a,b)=>a+b,0)/5);const rata=Math.round((rk+(S.lat||0)+(S.ev||0))/3);
 $("app").innerHTML=`<div class="card"><h2>🏆 Rekap Nilai</h2><p><b>${S.user.n}</b> — ${S.user.k}</p><table><tr><th>Komponen</th><th>Nilai</th></tr>`+ks.map((x,i)=>`<tr><td>Kuis Level ${i+1}</td><td>${x}</td></tr>`).join("")+`<tr><td><b>Rata-rata Kuis</b></td><td><b>${rk}</b></td></tr><tr><td><b>Latihan</b></td><td><b>${S.lat??"-"}</b></td></tr><tr><td><b>Evaluasi</b></td><td><b>${S.ev??"-"}</b></td></tr><tr><th>Rata-rata Nilai Akhir</th><th>${rata}</th></tr></table><div class="msg">${rata>=KKM?"🎉 Alhamdulillah, Anda tuntas KKM "+KKM+".":"Belum mencapai KKM "+KKM+". Pelajari materi lalu ulangi evaluasi."}</div><button class="btn" onclick="print()">🖨 Cetak</button><button class="btn o" onclick="if(confirm('Keluar?')){S.user=null;save();login()}">Keluar</button></div>`}
